# Project-wide Gradle settings.
# Purpose: Configure Gradle build behavior for the project
# Side Effects: Affects build performance and memory usage

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX migration
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enable non-transitive R classes
android.nonTransitiveRClass=true

# Enable Compose compiler reports (disabled by default)
# android.compose.compiler.report=true
